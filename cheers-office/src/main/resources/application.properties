# ==================================
# 1. サーバー設定
# ==================================
server.port=8080

# ==================================
# 2. Thymeleaf設定
# ==================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ==================================
# 3. ロギング設定
# ==================================
logging.level.org.springframework=INFO
logging.level.com.cheers.office=DEBUG


spring.jackson.serialization.write-dates-as-timestamps=false

# ==================================
# 4. カスタム設定（AWS EC2 外部ディレクトリ用）
# ==================================
# Tomcat の再デプロイでも消えないよう、/home/ec2-user/cheers-data に保存
app.user-file-path=/home/ec2-user/cheers-data/user.json
app.room-file-path=/home/ec2-user/cheers-data/rooms.json
app.thread-file-path=/home/ec2-user/cheers-data/thread.json
app.photopin-file-path=/home/ec2-user/cheers-data/photopins.json
app.calendar-file-path=/home/ec2-user/cheers-data/calendar_events.json
app.chat-log-dir=/home/ec2-user/cheers-data/chat_logs

# ==================================
# 5. ファイルアップロード設定（画像など）
# ==================================
# Tomcatのstatic配下ではなく、永続化用ディレクトリに保存
app.upload-dir.profile=/home/ec2-user/cheers-data/images/profile
app.upload-dir.photopin=/home/ec2-user/cheers-data/images/photopins
app.upload-dir.chat=/home/ec2-user/cheers-data/images/chat
app.upload-dir.thread=/home/ec2-user/cheers-data/images/thread
app.upload-dir.group=/home/ec2-user/cheers-data/images/groups

# ファイルアップロード容量制限
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==================================
# 6. FullCalendar CDN設定
# ==================================
# locales-all.global.min.js は存在しないため main.min.js のみを利用
fullcalendar.version=6.1.15
fullcalendar.cdn.base=https://cdn.jsdelivr.net/npm/fullcalendar@${fullcalendar.version}

# WARファイルとしてデプロイした時に prod プロファイルを有効にする
spring.profiles.active=prod
# タイムゾーンと日付フォーマット
spring.jackson.time-zone=Asia/Tokyo
